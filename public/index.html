<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expense Tracker</title>
  <meta name="description" content="Track income, expenses, accounts and net worth — private, fast and free.">
  <meta name="theme-color" content="#6C5CE7">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply saved theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem('theme') || 'system';
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Passphrase lock (shown only when app lock is enabled) -->
  <div id="lockScreen" class="lock-screen" hidden>
    <form class="lock-card" id="lockForm">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <h1>Expense Tracker</h1>
      <p class="lock-sub">Enter your passphrase to unlock</p>
      <input class="input" id="lockPass" type="password" name="passphrase"
        autocomplete="current-password" placeholder="Passphrase" required>
      <div class="lock-error" id="lockError" role="alert"></div>
      <button class="btn" id="lockBtn" type="submit">Unlock</button>
      <button class="btn secondary lock-theme" id="lockThemeBtn" type="button">Toggle theme</button>
    </form>
  </div>

  <div id="app">

    <!-- Sidebar (desktop) -->
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-icon">💸</span>
        <span class="brand-name">Expense&nbsp;Tracker</span>
      </div>
      <nav class="side-nav">
        <a href="#/dashboard" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="#/transactions" data-nav="transactions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>Transactions</span>
        </a>
        <a href="#/accounts" data-nav="accounts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>Accounts</span>
        </a>
        <a href="#/analytics" data-nav="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
          <span>Analytics</span>
        </a>
        <a href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          <span>Settings</span>
        </a>
      </nav>
      <button id="sideThemeBtn" class="theme-btn" type="button" title="Toggle theme" aria-label="Toggle dark mode">
        <span class="theme-icon-moon">🌙</span><span class="theme-icon-sun">☀️</span>
        <span class="theme-label">Theme</span>
      </button>
    </aside>

    <!-- Main column -->
    <div id="main">
      <header id="topbar">
        <h1 id="viewTitle">Dashboard</h1>
        <div id="viewActions"></div>
        <div class="topbar-quick">
          <a class="icon-btn topbar-nav" href="#/accounts" data-nav="accounts" aria-label="Accounts" title="Accounts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          </a>
          <a class="icon-btn topbar-nav" href="#/settings" data-nav="settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </a>
        </div>
        <button id="topThemeBtn" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle dark mode">
          <span class="theme-icon-moon">🌙</span><span class="theme-icon-sun">☀️</span>
        </button>
      </header>
      <div id="pullHint" class="pull-hint" aria-live="polite">Pull to refresh</div>
      <main id="view" tabindex="-1"><div class="loading-block">Loading…</div></main>
    </div>

    <!-- Bottom navigation (mobile) -->
    <nav id="bottomnav" aria-label="Main navigation">
      <div class="nav-liquid" aria-hidden="true">
        <span class="nav-blob trail"></span>
        <span class="nav-blob main"></span>
      </div>
      <a href="#/dashboard" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#/transactions" data-nav="transactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Activity</span>
      </a>
      <a href="#/accounts" data-nav="accounts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span>Accounts</span>
      </a>
      <a href="#/analytics" data-nav="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><path d="M2 20h20"/></svg>
        <span>Stats</span>
      </a>
      <a href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <!-- Bulk selection bar (transactions) -->
    <div id="txBulkBar" class="tx-bulk-bar" hidden>
      <div class="tx-bulk-top">
        <button class="tx-bulk-count" type="button" id="txBulkCount">0 selected</button>
        <button class="tx-bulk-link" type="button" id="txBulkAll">Select all</button>
      </div>
      <div class="tx-bulk-actions">
        <button class="tx-bulk-btn" type="button" id="txBulkCategory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Category</span>
        </button>
        <button class="tx-bulk-btn" type="button" id="txBulkTag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          <span>Tags</span>
        </button>
        <button class="tx-bulk-btn danger" type="button" id="txBulkDelete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          <span>Delete</span>
        </button>
      </div>
    </div>

    <button id="fab" type="button" aria-label="Add transaction" title="Add transaction (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <div id="modalRoot"></div>
    <div id="toastRoot" aria-live="polite"></div>
  </div>

  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/modals.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
